<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#BC6C25" />
    </linearGradient>
    <linearGradient id="sanSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5CD" />
      <stop offset="100%" stop-color="#F5CBA7" />
    </linearGradient>
    <linearGradient id="sanHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2723" />
      <stop offset="100%" stop-color="#1B0000" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FAF7F2" stroke="#0F4C3A" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="#FDFBF7"/>

  <!-- Torso & Stylish Bakery Partner Blazer -->
  <path d="M42 186 C42 144 70 126 100 126 C130 126 158 144 158 186 Z" fill="url(#sanGrad)"/>
  <polygon points="100,154 84,126 116,126" fill="#0F4C3A"/>
  <polygon points="100,146 88,126 112,126" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="91" y="104" width="18" height="24" rx="4" fill="url(#sanSkin)"/>

  <!-- Head -->
  <circle cx="100" cy="78" r="30" fill="url(#sanSkin)"/>

  <!-- Stylish medium wavy hair -->
  <path d="M66 76 C64 44 80 34 100 34 C120 34 136 44 134 76 C126 58 116 50 100 50 C84 50 74 58 66 76 Z" fill="url(#sanHair)"/>
  <path d="M64 76 C62 98 66 122 72 136 C76 120 72 96 74 78 Z" fill="url(#sanHair)"/>
  <path d="M136 76 C138 98 134 122 128 136 C124 120 128 96 126 78 Z" fill="url(#sanHair)"/>

  <!-- Facial features -->
  <ellipse cx="88" cy="76" rx="3.5" ry="3" fill="#1B0000"/>
  <ellipse cx="112" cy="76" rx="3.5" ry="3" fill="#1B0000"/>
  <circle cx="89.5" cy="74.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="113.5" cy="74.5" r="1.2" fill="#FFFFFF"/>
  <path d="M82 69 Q88 66 94 68" stroke="#1B0000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M106 68 Q112 66 118 69" stroke="#1B0000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="82" cy="85" r="5" fill="#FF8A80" opacity="0.4"/>
  <circle cx="118" cy="85" r="5" fill="#FF8A80" opacity="0.4"/>
  <!-- Cheerful Smile -->
  <path d="M92 91 Q100 98 108 91" stroke="#A75D28" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Bakery Croissant / Bread Glyph -->
  <circle cx="145" cy="55" r="16" fill="#0F4C3A" stroke="#D4A373" stroke-width="1.5"/>
  <path d="M139 56 Q145 49 151 56 Q145 61 139 56 Z" fill="#D4A373"/>

  <!-- Role Badge -->
  <rect x="34" y="166" width="132" height="22" rx="11" fill="#0F4C3A" stroke="#D4A373" stroke-width="1.5"/>
  <text x="100" y="181" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">BAKERY PARTNERSHIPS</text>
</svg>
