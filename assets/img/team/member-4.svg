<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="zinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C3A" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="zinSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="100%" stop-color="#FFCC80" />
    </linearGradient>
    <linearGradient id="zinHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212529" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FAF7F2" stroke="url(#zinGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="#F4FAF6"/>

  <!-- Torso & Tech Cardigan -->
  <path d="M42 186 C42 144 70 126 100 126 C130 126 158 144 158 186 Z" fill="url(#zinGrad)"/>
  <polygon points="100,154 86,126 114,126" fill="#1B4332"/>
  <polygon points="100,146 90,126 110,126" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="91" y="104" width="18" height="24" rx="4" fill="url(#zinSkin)"/>

  <!-- Head -->
  <circle cx="100" cy="78" r="31" fill="url(#zinSkin)"/>

  <!-- Modern Hair Style -->
  <path d="M68 74 C66 44 80 34 100 34 C120 34 134 44 132 74 C126 58 116 52 100 52 C82 52 74 60 68 74 Z" fill="url(#zinHair)"/>
  <path d="M72 58 Q88 42 104 46 Q86 52 76 66 Z" fill="url(#zinHair)"/>

  <!-- Designer Glasses -->
  <rect x="76" y="70" width="18" height="13" rx="3" fill="none" stroke="#0F4C3A" stroke-width="2.5"/>
  <rect x="106" y="70" width="18" height="13" rx="3" fill="none" stroke="#0F4C3A" stroke-width="2.5"/>
  <line x1="94" y1="76" x2="106" y2="76" stroke="#0F4C3A" stroke-width="2.5"/>

  <!-- Eyes -->
  <circle cx="85" cy="76.5" r="2.5" fill="#0F172A"/>
  <circle cx="115" cy="76.5" r="2.5" fill="#0F172A"/>

  <!-- Confident Smile -->
  <path d="M92 92 Q100 98 108 92" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Floating Code Icon -->
  <circle cx="145" cy="55" r="16" fill="#0F4C3A" stroke="#74C69D" stroke-width="1.5"/>
  <text x="145" y="59" fill="#D8F3DC" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>

  <!-- Role Badge -->
  <rect x="34" y="166" width="132" height="22" rx="11" fill="#0F4C3A" stroke="#74C69D" stroke-width="1.5"/>
  <text x="100" y="181" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">LEAD PLATFORM &amp; UI/UX</text>
</svg>
