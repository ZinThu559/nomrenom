  <ellipse cx="75" cy="65" rx="3.5" ry="6" transform="rotate(-30 75 65)" fill="#D4A373"/>
  <ellipse cx="85" cy="65" rx="3.5" ry="6" transform="rotate(30 85 65)" fill="#D4A373"/>
  <!-- Typography -->
  <text x="80" y="98" fill="#1B4332" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">SÀI GÒN</text>
  <text x="80" y="112" fill="#BC6C25" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" letter-spacing="2">ARTISAN</text>
  <text x="80" y="126" fill="#718096" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">SOURDOUGH &amp; BAKE</text>
