      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="amber2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373" />
      <stop offset="100%" stop-color="#BC6C25" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="80" cy="80" r="76" fill="#FAF7F2" stroke="url(#blogo2)" stroke-width="4"/>
