<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C3A" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <linearGradient id="tramSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="100%" stop-color="#FFCC80" />
    </linearGradient>
    <linearGradient id="tramHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261C14" />
      <stop offset="100%" stop-color="#150E09" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FAF7F2" stroke="url(#tramGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="#F4EFE6"/>

  <!-- Long hair back layer -->
  <path d="M60 76 C55 110 58 148 64 165 C68 175 76 175 78 165 C82 145 78 110 82 85 Z" fill="url(#tramHair)"/>
  <path d="M140 76 C145 110 142 148 136 165 C132 175 124 175 122 165 C118 145 122 110 118 85 Z" fill="url(#tramHair)"/>

  <!-- Torso & Executive Blazer -->
  <path d="M42 186 C42 142 70 126 100 126 C130 126 158 142 158 186 Z" fill="url(#tramGrad)"/>
  <!-- Blouse V-neck -->
  <polygon points="100,154 84,126 116,126" fill="#F8F9FA"/>
  <polygon points="100,146 88,126 112,126" fill="#FFFFFF"/>

  <!-- Neck -->
  <rect x="91" y="104" width="18" height="24" rx="4" fill="url(#tramSkin)"/>

  <!-- Head -->
  <circle cx="100" cy="78" r="30" fill="url(#tramSkin)"/>

  <!-- Facial features -->
  <!-- Eyes -->
  <ellipse cx="88" cy="76" rx="3.5" ry="3" fill="#150E09"/>
  <ellipse cx="112" cy="76" rx="3.5" ry="3" fill="#150E09"/>
  <!-- Highlights -->
  <circle cx="89.5" cy="74.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="113.5" cy="74.5" r="1.2" fill="#FFFFFF"/>
  <!-- Eyebrows -->
  <path d="M82 69 Q88 66 94 68" stroke="#150E09" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M106 68 Q112 66 118 69" stroke="#150E09" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Soft Blush -->
  <circle cx="82" cy="85" r="5" fill="#FF8A80" opacity="0.45"/>
  <circle cx="118" cy="85" r="5" fill="#FF8A80" opacity="0.45"/>
  <!-- Friendly Warm Smile -->
  <path d="M92 90 Q100 97 108 90" stroke="#C2185B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Front Hair Styling -->
  <path d="M68 76 C66 44 82 36 100 36 C118 36 134 44 132 76 C124 58 116 50 100 50 C84 50 74 58 68 76 Z" fill="url(#tramHair)"/>
  <path d="M72 65 Q85 55 98 60 Q82 66 74 76 Z" fill="url(#tramHair)"/>

  <!-- Role Badge -->
  <rect x="42" y="166" width="116" height="22" rx="11" fill="#0F4C3A" stroke="#52B788" stroke-width="1.5"/>
  <text x="100" y="181" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">FOUNDER &amp; CEO</text>
</svg>
