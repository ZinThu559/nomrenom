<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="locGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <linearGradient id="locSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F0C29E" />
    </linearGradient>
    <linearGradient id="locHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D221A" />
      <stop offset="100%" stop-color="#1A1410" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FAF7F2" stroke="url(#locGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="#F4EFE6"/>

  <!-- Torso & Operations Jacket -->
  <path d="M42 186 C42 144 70 128 100 128 C130 128 158 144 158 186 Z" fill="url(#locGrad)"/>
  <!-- Collar & Shirt -->
  <polygon points="100,150 86,128 114,128" fill="#FFFFFF"/>
  <polygon points="100,142 90,128 110,128" fill="#E8F5E9"/>

  <!-- Neck -->
  <rect x="91" y="104" width="18" height="26" rx="4" fill="url(#locSkin)"/>

  <!-- Head -->
  <circle cx="100" cy="78" r="31" fill="url(#locSkin)"/>

  <!-- Short Modern Hair with clean side-part -->
  <path d="M68 74 C66 42 82 34 102 34 C122 34 132 44 132 68 C126 56 116 52 100 52 C84 52 74 60 68 74 Z" fill="url(#locHair)"/>
  <path d="M72 58 Q88 44 104 46 Q86 52 76 66 Z" fill="url(#locHair)"/>

  <!-- Facial features -->
  <!-- Eyes -->
  <ellipse cx="88" cy="76" rx="3.5" ry="3" fill="#1A1410"/>
  <ellipse cx="112" cy="76" rx="3.5" ry="3" fill="#1A1410"/>
  <circle cx="89.5" cy="74.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="113.5" cy="74.5" r="1.2" fill="#FFFFFF"/>
  <!-- Eyebrows -->
  <path d="M82 69 Q88 66 94 68" stroke="#1A1410" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M106 68 Q112 66 118 69" stroke="#1A1410" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Confident Friendly Smile -->
  <path d="M92 92 Q100 98 108 92" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Floating Logistics Icon -->
  <circle cx="145" cy="55" r="16" fill="#1B4332" stroke="#52B788" stroke-width="1.5"/>
  <path d="M140 55 L144 59 L151 51" stroke="#D8F3DC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Role Badge -->
  <rect x="36" y="166" width="128" height="22" rx="11" fill="#1B4332" stroke="#52B788" stroke-width="1.5"/>
  <text x="100" y="181" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">HEAD OF OPERATIONS</text>
</svg>
