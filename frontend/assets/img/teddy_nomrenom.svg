<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 370" width="100%" height="100%">
  <defs>
    <!-- Sticker Drop Shadow -->
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F4C3A" flood-opacity="0.20" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10" />
    </filter>

    <!-- Fur Gradients -->
    <radialGradient id="headFur" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#F5C488" />
      <stop offset="60%" stop-color="#DE9952" />
      <stop offset="100%" stop-color="#BD742E" />
    </radialGradient>
    <radialGradient id="bodyFur" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E2A15C" />
      <stop offset="70%" stop-color="#CE873D" />
      <stop offset="100%" stop-color="#A65F1D" />
    </radialGradient>
    <radialGradient id="muzzleGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFF8EE" />
      <stop offset="85%" stop-color="#FDE8CE" />
      <stop offset="100%" stop-color="#F2CCA6" />
    </radialGradient>
    <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDCE3" />
      <stop offset="70%" stop-color="#F8A7B8" />
      <stop offset="100%" stop-color="#DE9952" />
    </radialGradient>
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C7E" stop-opacity="0.60" />
      <stop offset="100%" stop-color="#FF5C7E" stop-opacity="0" />
    </radialGradient>

    <!-- T-shirt Gradients -->
    <linearGradient id="tshirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E755B" />
      <stop offset="45%" stop-color="#0F4C3A" />
      <stop offset="100%" stop-color="#083024" />
    </linearGradient>
    <linearGradient id="tshirtSleeveL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6F55" />
      <stop offset="100%" stop-color="#0B392B" />
    </linearGradient>
    <linearGradient id="tshirtSleeveR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B392B" />
      <stop offset="100%" stop-color="#1B6F55" />
    </linearGradient>

    <!-- Gold Cookie / Snack Badge -->
    <radialGradient id="snackGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="70%" stop-color="#FDCB6E" />
      <stop offset="100%" stop-color="#E17055" />
    </radialGradient>
  </defs>

  <!-- Group with Sticker Shadow -->
  <g filter="url(#stickerShadow)">

    <!-- ================= STICKER WHITE DIE-CUT BORDER SILHOUETTE ================= -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
      <!-- Ears backing -->
      <circle cx="100" cy="85" r="38" />
      <circle cx="220" cy="85" r="38" />
      <!-- Head backing -->
      <ellipse cx="160" cy="140" rx="76" ry="68" />
      <!-- Torso & Feet backing -->
      <ellipse cx="160" cy="245" rx="74" ry="76" />
      <ellipse cx="115" cy="312" rx="36" ry="24" />
      <ellipse cx="205" cy="312" rx="36" ry="24" />
      <!-- Left arm (holding cookie) backing -->
      <ellipse cx="82" cy="232" rx="32" ry="28" />
      <!-- Right waving arm backing -->
      <path d="M200,200 Q245,185 260,140 Q270,125 255,120 Q235,130 220,175 Z" />
      <circle cx="258" cy="136" r="28" />
    </g>

    <!-- ================= TEDDY FEET & BASE ================= -->
    <g>
      <!-- Left foot -->
      <ellipse cx="115" cy="310" rx="30" ry="20" fill="url(#bodyFur)" />
      <ellipse cx="115" cy="313" rx="16" ry="11" fill="#FCE1C3" />
      <circle cx="104" cy="303" r="4.5" fill="#FCE1C3" />
      <circle cx="115" cy="300" r="5" fill="#FCE1C3" />
      <circle cx="126" cy="303" r="4.5" fill="#FCE1C3" />
      
      <!-- Right foot -->
      <ellipse cx="205" cy="310" rx="30" ry="20" fill="url(#bodyFur)" />
      <ellipse cx="205" cy="313" rx="16" ry="11" fill="#FCE1C3" />
      <circle cx="194" cy="303" r="4.5" fill="#FCE1C3" />
      <circle cx="205" cy="300" r="5" fill="#FCE1C3" />
      <circle cx="216" cy="303" r="4.5" fill="#FCE1C3" />
    </g>

    <!-- Torso Fur (Behind Shirt) -->
    <ellipse cx="160" cy="242" rx="60" ry="62" fill="url(#bodyFur)" />

    <!-- ================= ARMS (UNDER SLEEVES) ================= -->
    <!-- Left Hand Holding Cookie -->
    <g>
      <!-- Arm segment -->
      <path d="M106,205 Q85,215 76,236 Q88,252 104,235 Z" fill="url(#bodyFur)" />
      <!-- Crunchy Cookie -->
      <circle cx="72" cy="242" r="15" fill="url(#snackGrad)" stroke="#B33924" stroke-width="1" />
      <!-- Chocolate chips on cookie -->
      <circle cx="68" cy="238" r="2.2" fill="#3D1C06" />
      <circle cx="75" cy="237" r="2.5" fill="#3D1C06" />
      <circle cx="70" cy="246" r="2" fill="#3D1C06" />
      <circle cx="78" cy="245" r="2.2" fill="#3D1C06" />
      <!-- Cute Paw Pads clutching cookie -->
      <ellipse cx="82" cy="244" rx="5" ry="4" fill="#FCE1C3" />
      <ellipse cx="85" cy="237" rx="4" ry="4" fill="#FCE1C3" />
    </g>

    <!-- Right Waving Arm -->
    <g>
      <!-- Smooth continuous waving arm from shoulder up to paw -->
      <path d="M212,195 C230,185 245,165 254,142 C257,135 248,130 240,146 C230,165 218,182 206,192 Z" fill="url(#bodyFur)" />
      <!-- Waving Round Paw -->
      <circle cx="254" cy="136" r="18" fill="url(#headFur)" />
      <!-- Paw Pads (Bear Paw Print) -->
      <ellipse cx="253" cy="139" rx="9" ry="7" fill="#FCE1C3" />
      <circle cx="245" cy="129" r="3" fill="#FCE1C3" />
      <circle cx="253" cy="126" r="3.2" fill="#FCE1C3" />
      <circle cx="261" cy="129" r="3" fill="#FCE1C3" />

      <!-- Waving sparkle lines -->
      <path d="M275,126 Q280,131 275,137" stroke="#FDCB6E" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M280,132 Q285,137 280,143" stroke="#FDCB6E" stroke-width="3" stroke-linecap="round" fill="none" />
      <!-- Golden Sparkle Star -->
      <path d="M268,110 L271,116 L277,118 L271,121 L268,127 L265,121 L259,118 L265,116 Z" fill="#FFEAA7" />
    </g>

    <!-- ================= GREEN NOMRENOM T-SHIRT ================= -->
    <g>
      <!-- Left Sleeve -->
      <path d="M116,192 L86,212 C82,217 84,226 94,228 L114,212 Z" fill="url(#tshirtSleeveL)" />
      <path d="M86,212 C82,217 84,226 94,228" stroke="#093528" stroke-width="1.5" fill="none" />

      <!-- Right Sleeve -->
      <path d="M204,192 L234,182 C240,185 242,194 234,202 L206,212 Z" fill="url(#tshirtSleeveR)" />
      <path d="M234,182 C240,185 242,194 234,202" stroke="#093528" stroke-width="1.5" fill="none" />

      <!-- Main T-Shirt Body -->
      <path d="M112,190 
               C108,212 106,245 108,272 
               C132,278 188,278 212,272 
               C214,245 212,212 208,190 
               C194,198 178,202 160,202 
               C142,202 126,198 112,190 Z" 
            fill="url(#tshirtGrad)" />

      <!-- Shirt Collar Trim -->
      <path d="M136,191 C144,199 176,199 184,191 C178,195 142,195 136,191 Z" 
            fill="#FFFFFF" />
      <path d="M134,190 C144,201 176,201 186,190" 
            stroke="#E5D9C8" stroke-width="2.5" fill="none" stroke-linecap="round" />

      <!-- T-shirt Bottom Hemline Accent -->
      <path d="M109,268 C132,274 188,274 211,268" 
            stroke="#1B6F55" stroke-width="2.5" fill="none" opacity="0.6" />

      <!-- ===== NOMRENOM LOGO ON CHEST ===== -->
      <!-- Mini Shopping Basket Icon -->
      <g transform="translate(150, 210) scale(0.95)">
        <path d="M6,6 C6,1 16,1 16,6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
        <path d="M3,6 L19,6 L17,17 C16.8,18 15.5,18.5 14,18.5 L8,18.5 C6.5,18.5 5.2,18 5,17 Z" fill="#FFFFFF" />
        <path d="M5,9.5 L17,9.5" stroke="#0F4C3A" stroke-width="1.3" />
        <path d="M7,13.5 L15,13.5" stroke="#0F4C3A" stroke-width="1.3" />
        <path d="M11,6 L11,18.5" stroke="#0F4C3A" stroke-width="1.3" />
      </g>

      <!-- Brand Text "NomReNom" -->
      <text x="160" y="242" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" 
            font-weight="900" 
            letter-spacing="0.5"
            text-anchor="middle" 
            fill="#FFFFFF"
            style="filter: drop-shadow(0 1.5px 2px rgba(0,0,0,0.5));">
        NomReNom
      </text>

      <!-- Sub-tag "SNACK RESCUE" -->
      <rect x="122" y="247" width="76" height="8.5" rx="4.25" fill="#FFEAA7" />
      <text x="160" y="253.5" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
            font-size="6" 
            font-weight="800" 
            letter-spacing="1"
            text-anchor="middle" 
            fill="#0F4C3A">
        SNACK RESCUE
      </text>
    </g>

    <!-- ================= EARS ================= -->
    <circle cx="100" cy="85" r="32" fill="url(#headFur)" />
    <circle cx="220" cy="85" r="32" fill="url(#headFur)" />
    <ellipse cx="100" cy="85" rx="19" ry="18" fill="url(#earInner)" />
    <ellipse cx="220" cy="85" rx="19" ry="18" fill="url(#earInner)" />

    <!-- ================= HEAD ================= -->
    <ellipse cx="160" cy="138" rx="70" ry="62" fill="url(#headFur)" />
    
    <!-- Cute Head Fur Tufts on Top -->
    <path d="M152,78 Q160,65 162,76 Q168,68 170,79 Z" fill="#DE9952" />

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="112" cy="155" rx="18" ry="11" fill="url(#cheekBlush)" />
    <ellipse cx="208" cy="155" rx="18" ry="11" fill="url(#cheekBlush)" />

    <!-- Snout / Muzzle -->
    <ellipse cx="160" cy="154" rx="34" ry="26" fill="url(#muzzleGrad)" />

    <!-- Nose -->
    <path d="M150,140 Q160,136 170,140 Q168,149 160,150 Q152,149 150,140 Z" fill="#2B1700" />
    <ellipse cx="157" cy="140" rx="4" ry="2" fill="#FFFFFF" opacity="0.6" />

    <!-- Cheerful Big Smile & Tongue -->
    <path d="M160,150 L160,157" stroke="#2B1700" stroke-width="2.5" stroke-linecap="round" />
    <path d="M145,157 Q160,175 175,157" fill="#800D1E" stroke="#2B1700" stroke-width="2.5" stroke-linecap="round" />
    <path d="M151,164 Q160,174 169,164 Q164,160 151,164 Z" fill="#FF708F" />
    <path d="M143,155 Q145,158 147,159" stroke="#2B1700" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M177,155 Q175,158 173,159" stroke="#2B1700" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Glistening Eyes -->
    <ellipse cx="126" cy="130" rx="9" ry="11" fill="#2B1700" />
    <circle cx="123" cy="126" r="3.5" fill="#FFFFFF" />
    <circle cx="128" cy="134" r="1.5" fill="#FFFFFF" />

    <ellipse cx="194" cy="130" rx="9" ry="11" fill="#2B1700" />
    <circle cx="191" cy="126" r="3.5" fill="#FFFFFF" />
    <circle cx="196" cy="134" r="1.5" fill="#FFFFFF" />

    <!-- Cute Curved Eyebrows -->
    <path d="M118,115 Q126,110 134,114" stroke="#8A4A10" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M186,114 Q194,110 202,115" stroke="#8A4A10" stroke-width="2.5" stroke-linecap="round" fill="none" />

  </g>
</svg>
